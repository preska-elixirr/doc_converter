<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap">
  <style>
    body { margin: 0; font-family: 'Patrick Hand', 'Segoe Print', 'Comic Sans MS', cursive; color: #2b2b2b; }
    a { color: #2b2b2b; } a:hover { color: #000000; }
  </style>
</helmet>
<div style="width: 1200px; height: 760px; background: #ffffff; display: flex; flex-direction: column; box-sizing: border-box; border: 2px solid #2b2b2b; overflow: hidden;">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 24px; border-bottom: 2px solid #2b2b2b; box-sizing: border-box; font-size: 20px;">
    <span>Doc Converter (alternate: one step at a time)</span>
    <span style="font-size: 16px; color: #777777;">rough sketch</span>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 16px; padding: 28px 24px 8px; font-size: 18px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #2b2b2b; color: #ffffff; display: flex; align-items: center; justify-content: center;">1</div>
      <span>Pick files</span>
    </div>
    <div style="width: 80px; height: 2px; background: #2b2b2b;"></div>
    <div style="display: flex; align-items: center; gap: 8px; color: #999999;">
      <div style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid #999999; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">2</div>
      <span>Pick format</span>
    </div>
    <div style="width: 80px; height: 2px; background: #999999;"></div>
    <div style="display: flex; align-items: center; gap: 8px; color: #999999;">
      <div style="width: 32px; height: 32px; border-radius: 50%; border: 2px solid #999999; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">3</div>
      <span>Convert</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; flex-grow: 1; align-items: center; justify-content: center; gap: 20px; padding: 24px; box-sizing: border-box;">
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; width: 720px; height: 300px; border: 3px dashed #2b2b2b; border-radius: 16px; font-size: 26px;">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M6 10l6-6 6 6"></path><path d="M4 20h16"></path></svg>
      <span>Drop documents here</span>
      <span style="font-size: 18px; color: #777777;">or click to browse</span>
    </div>
    <div style="display: flex; gap: 12px; font-size: 18px;">
      <div style="padding: 8px 16px; border: 2px solid #2b2b2b; border-radius: 8px;">Quarterly report 2026.docx ×</div>
      <div style="padding: 8px 16px; border: 2px solid #2b2b2b; border-radius: 8px;">Invoice_0342.pdf ×</div>
      <div style="padding: 8px 16px; border: 2px solid #2b2b2b; border-radius: 8px;">notes.md ×</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-top: 2px solid #2b2b2b; font-size: 18px;">
    <span style="color: #777777;">3 files</span>
    <div style="padding: 10px 28px; background: #2b2b2b; color: #ffffff; border-radius: 8px;">Next: pick format →</div>
  </div>
</div>
</x-dc>
</body>
</html>
